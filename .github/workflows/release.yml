name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: rust-macos-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: rust-macos-

      - name: Install cargo-tauri
        run: cargo install tauri-cli --version "^2" --locked

      - name: Frontend tests
        working-directory: desktop/src
        run: node --test

      - name: Rust lib tests
        working-directory: desktop/src-tauri
        run: cargo test --lib --quiet

      - name: Build macOS app + dmg
        working-directory: desktop
        run: cargo tauri build --bundles app,dmg
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundles
          path: |
            desktop/src-tauri/target/release/bundle/macos/*.app
            desktop/src-tauri/target/release/bundle/dmg/*.dmg

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: rust-windows-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: rust-windows-

      - name: Install cargo-tauri
        run: cargo install tauri-cli --version "^2" --locked

      - name: Frontend tests
        working-directory: desktop/src
        run: node --test

      - name: Rust lib tests
        working-directory: desktop/src-tauri
        run: cargo test --lib --quiet

      - name: Build Windows msi + nsis
        working-directory: desktop
        run: cargo tauri build --bundles msi,nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundles
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe

  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: rust-linux-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: rust-linux-

      - name: Install cargo-tauri
        run: cargo install tauri-cli --version "^2" --locked

      - name: Frontend tests
        working-directory: desktop/src
        run: node --test

      - name: Rust lib tests
        working-directory: desktop/src-tauri
        run: cargo test --lib --quiet

      - name: Build Linux deb + AppImage
        working-directory: desktop
        run: cargo tauri build --bundles deb,appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Weakup ${{ github.ref_name }}"
          body: |
            ## Weakup ${{ github.ref_name }}

            Desktop utility for Windows, macOS, and Linux.
            Keep the display awake and schedule safe shutdowns.

            ### Downloads
            | Platform | File |
            |----------|------|
            | macOS | `.dmg` |
            | Windows | `.msi` or `.exe` (NSIS) |
            | Linux | `.deb` or `.AppImage` |

            ### Safety
            A cancellable 60-second warning always appears before any scheduled shutdown.
            Power-off jobs more than 15 minutes overdue are never executed.
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app
            artifacts/**/*.msi
            artifacts/**/*.exe
            artifacts/**/*.deb
            artifacts/**/*.AppImage

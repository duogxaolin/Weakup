name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run frontend tests
        working-directory: desktop/src
        run: node --test

  rust:
    name: Rust tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: rust-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Rust lib tests
        working-directory: desktop/src-tauri
        run: cargo test --lib --quiet

      - name: Clippy (warnings denied)
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  shared-vectors:
    name: Shared test vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: rust-vec-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: rust-vec-${{ runner.os }}-

      - name: Run shared vectors (Rust)
        working-directory: desktop/src-tauri
        run: cargo test --test shared_vectors --quiet

  cross-check:
    name: Cross type-check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: rust-cross-${{ matrix.target }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: rust-cross-${{ matrix.target }}-

      - name: Type-check for ${{ matrix.target }}
        working-directory: desktop/src-tauri
        run: cargo check --target ${{ matrix.target }}
        env:
          # Avoid linking on cross-targets
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: ""
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: ""

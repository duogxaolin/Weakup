name: weakup
description: "Cross-platform power scheduler — keep-awake and scheduled power-off."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2

  # Persistence
  drift: ^2.34.3
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0+eol

  # Screen keep-awake
  wakelock_plus: ^1.7.0

  # Desktop tray + window management
  tray_manager: ^0.5.3
  window_manager: ^0.5.2
  launch_at_startup: ^0.5.1

  # Android background service
  flutter_foreground_task: ^10.0.0

  # Notifications
  flutter_local_notifications: ^22.2.0

  # Timezone-aware scheduling
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Permission handling
  permission_handler: ^12.0.0+1
  cryptography: ^2.9.0

  # The private half of this device's identity goes to the platform's protected
  # credential store — Keystore on Android, Keychain on iOS — and never to the
  # database, a preference file, or a log. Reached only through
  # `lib/platform/secret_store.dart`, which is what lets every decision be tested
  # against an in-memory fake instead.
  # Pinned to 10.x deliberately. 11.0.0 raises compileSdk to 37, and no
  # `platforms;android-37` package exists in the SDK repository yet — only a
  # preview `android-37.0`, which Gradle does not resolve. Taking 11.0.0 makes
  # the Android build unassemblable. Revisit once API 37 ships as stable.
  flutter_secure_storage: ^10.3.1

  # Remote transport. The relay is Firestore documents holding opaque signed
  # envelopes it cannot read (design D1); `firebase_messaging` is a wake-up
  # signal only and carries no command content (design D4). `google_sign_in`
  # backs the Dart `AuthProvider` — the account names an owner and is never an
  # input to the command decision.
  # Majors pinned. Each was checked against `compileSdk` 36 before being added,
  # the way `flutter_secure_storage` 11 had to be pinned back for demanding 37:
  # the three FlutterFire plugins resolve `compileSdk` from their bundled
  # `local-config.gradle`, which sets 34, and `google_sign_in_android` inherits
  # `flutter.compileSdkVersion`. None requires 37, so none is held back.
  firebase_core: ^4.13.0
  cloud_firestore: ^6.8.0
  firebase_messaging: ^16.5.0
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.34.0

# win32_registry 3.x uses win32 ^6 matching wakelock_plus's requirement.
# launch_at_startup 0.5.1 targets win32_registry ^2.0.0 but the API changed
# in 3.x; a local patched copy at local_packages/launch_at_startup is used
# instead so both packages coexist with win32 6.x.
dependency_overrides:
  win32_registry: ^3.0.3
  launch_at_startup:
    path: local_packages/launch_at_startup

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png

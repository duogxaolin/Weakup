[package]
name = "weakup-desktop"
version = "0.1.0"
description = "Weakup desktop — keep-awake and scheduled power-off for Windows, macOS, and Linux."
authors = ["Weakup"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "weakup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-log = "2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
# Signature verification, and — as of this change — generation of this device's own
# identity. `rand_core` is what enables keypair generation, and it is scoped to
# `domain/device_identity.rs`: no other code path creates a key. The previous change
# deliberately excluded this feature because it only ever verified; generation genuinely
# needs entropy, and this is the change that has a reason to generate (design D-rand).
ed25519-dalek = { version = "3", default-features = false, features = ["alloc", "rand_core"] }
# The private half of this device's identity goes to the platform's protected credential
# store — Keychain, Credential Manager, Secret Service — and never to the database, a
# config file, or a log. Reached only through `platform/secret_store.rs`, which is what
# lets every decision be tested against an in-memory fake instead.
keyring = "4.1"
# Already in the tree via `uuid`; named explicitly because this crate now calls it directly,
# in the same way `iana-time-zone` is. `sys_rng` is a feature on a crate that was already
# being compiled, not a new dependency — it adds no crate to `Cargo.lock`. It supplies the
# system CSPRNG that `SigningKey::generate` requires, and is used in exactly one place:
# generating this device's identity in `domain/device_identity.rs`.
getrandom = { version = "0.4", features = ["sys_rng"] }
# Already in the tree via `ed25519-dalek`, which hashes with it; named explicitly for the
# same reason, because the device-id derivation calls SHA-256 directly. Adds no crate to
# `Cargo.lock`.
sha2 = { version = "0.11", default-features = false }
# Already in the tree via chrono; named explicitly because this crate calls it directly.
iana-time-zone = "0.1.65"

# Linux keep-awake uses the freedesktop screensaver D-Bus interface, which is what
# actually stops screen blanking under GNOME and KDE. Linux-only: nothing else needs
# a D-Bus client, and the macOS and Windows builds should not carry one.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.18.0"

[dev-dependencies]
tempfile = "3"
# Tests sign; the library only verifies. Naming the same crate here rather than widening the
# dependency above is what keeps a signing key type out of the shipped build — see
# `tests/signing_support/mod.rs`. Still no key-generation feature: fixed seeds need no
# entropy, and Ed25519 signing is deterministic.
ed25519-dalek = { version = "3", default-features = false, features = ["alloc"] }

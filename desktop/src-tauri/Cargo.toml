[package]
name = "weakup-desktop"
version = "0.1.0"
description = "Weakup desktop — keep-awake and scheduled power-off for Windows, macOS, and Linux."
authors = ["Weakup"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "weakup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-log = "2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

# Linux keep-awake uses the freedesktop screensaver D-Bus interface, which is what
# actually stops screen blanking under GNOME and KDE. Linux-only: nothing else needs
# a D-Bus client, and the macOS and Windows builds should not carry one.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.18.0"

[dev-dependencies]
tempfile = "3"

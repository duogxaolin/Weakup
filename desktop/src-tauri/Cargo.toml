[package]
name = "weakup-desktop"
version = "0.1.0"
description = "Weakup desktop — keep-awake and scheduled power-off for Windows, macOS, and Linux."
authors = ["Weakup"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "weakup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-log = "2"
rusqlite = { version = "0.40.1", features = ["bundled"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
# Signature verification only. `rand_core` — the feature that enables keypair generation —
# is deliberately absent: this crate verifies signatures against a key it is given and never
# creates or persists one (design D6). Adding it would make key generation reachable from a
# module whose whole guarantee is that it only checks arithmetic.
ed25519-dalek = { version = "3", default-features = false, features = ["alloc"] }
# Already in the tree via chrono; named explicitly because this crate calls it directly.
iana-time-zone = "0.1.65"

# Linux keep-awake uses the freedesktop screensaver D-Bus interface, which is what
# actually stops screen blanking under GNOME and KDE. Linux-only: nothing else needs
# a D-Bus client, and the macOS and Windows builds should not carry one.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5.18.0"

[dev-dependencies]
tempfile = "3"
# Tests sign; the library only verifies. Naming the same crate here rather than widening the
# dependency above is what keeps a signing key type out of the shipped build — see
# `tests/signing_support/mod.rs`. Still no key-generation feature: fixed seeds need no
# entropy, and Ed25519 signing is deterministic.
ed25519-dalek = { version = "3", default-features = false, features = ["alloc"] }
